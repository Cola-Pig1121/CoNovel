[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conovel-backend"
version = "0.1.0"
description = "CoNovel - AI-powered novel writing assistant backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
]

[project.scripts]
conovel = "app.main:run"

[tool.setuptools]
packages = ["app", "app.routers"]
